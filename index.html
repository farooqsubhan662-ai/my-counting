<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counting 1 to 999999</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
#gate{position:fixed;inset:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.box{background:#fff;width:min(400px,100%);padding:28px;border-radius:15px;box-shadow:0 5px 25px #0002;text-align:center}
.box input{width:100%;padding:13px;font-size:18px;border:1px solid #bbb;border-radius:8px;margin:10px 0}
button{padding:12px 17px;border:0;border-radius:8px;cursor:pointer;font-size:16px}
#unlock{width:100%}
#app{display:none}
header{position:sticky;top:0;background:white;padding:18px;box-shadow:0 2px 10px #0002;z-index:10}
h1{margin:0 0 12px;font-size:24px}
.search{display:flex;gap:8px;flex-wrap:wrap;max-width:750px}
.search input{flex:1;min-width:180px;padding:13px;font-size:18px;border:1px solid #bbb;border-radius:8px}
#status{margin-top:10px;color:#555}
main{padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001}
.big{font-size:36px;font-weight:bold;margin:8px 0}
.near{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.n{padding:7px 10px;background:#eee;border-radius:6px}
.hit{background:#ffe082;font-weight:bold;outline:2px solid #f9a825}
.err{color:#c62828;min-height:20px}
</style>
</head>
<body>
<div id="gate"><div class="box">
<h2>🔐 Password Required</h2>
<p>Counting file kholne ke liye password enter karein.</p>
<input id="pw" type="password" placeholder="Password">
<button id="unlock">🔓 Unlock</button>
<div id="err" class="err"></div>
</div></div>

<div id="app">
<header>
<h1>🔢 Counting 1 to 999999</h1>
<div class="search">
<input id="q" type="number" min="1" max="999999" placeholder="Enter a number, e.g. 500000">
<button id="search">🔍 Search</button>
<button id="clear">Clear</button>
</div>
<div id="status">Search any number from 1 to 999,999.</div>
</header>
<main id="result"></main>
</div>

<script>
const PASSWORD="1155";
const gate=document.getElementById("gate"), app=document.getElementById("app");
const pw=document.getElementById("pw"), err=document.getElementById("err");
function unlock(){
 if(pw.value===PASSWORD){gate.style.display="none";app.style.display="block";document.getElementById("q").focus();}
 else{err.textContent="❌ Wrong password!";pw.value="";pw.focus();}
}
document.getElementById("unlock").addEventListener("click",unlock);
pw.addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});

const q=document.getElementById("q"), result=document.getElementById("result"), status=document.getElementById("status");
function searchNumber(){
 const value=q.value.trim(), n=Number(value);
 if(value==="" || !Number.isInteger(n) || n<1 || n>999999){
  result.innerHTML="";status.textContent="❌ Please enter a whole number from 1 to 999,999.";return;
 }
 let nearby="", start=Math.max(1,n-10), end=Math.min(999999,n+10);
 for(let i=start;i<=end;i++) nearby+='<span class="n '+(i===n?'hit':'')+'">'+i+'</span>';
 result.innerHTML='<div class="card"><div>✅ Number found:</div><div class="big">'+n+'</div><div>Numbers around it:</div><div class="near">'+nearby+'</div></div>';
 status.textContent="✅ Number "+n+" found.";
}
function clearSearch(){q.value="";result.innerHTML="";status.textContent="Search any number from 1 to 999,999.";q.focus();}
document.getElementById("search").addEventListener("click",searchNumber);
document.getElementById("clear").addEventListener("click",clearSearch);
q.addEventListener("keydown",e=>{if(e.key==="Enter")searchNumber();});
</script>
</body>
</html>
